services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-flysoft_flight_service}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  migrate:
    image: migrate/migrate:v4.19.0
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path
      - /migrations
      - -database
      - postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:${DB_PORT:-5432}/${DB_NAME:-flysoft_flight_service}?sslmode=${DB_SSLMODE:-disable}
      - up
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment: &app_environment
      HTTP_PORT: ${HTTP_PORT:-8080}
      DB_HOST: db
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-flysoft_flight_service}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OFFER_TTL: ${OFFER_TTL:-30m}
      COMMISSION_PERCENT: ${COMMISSION_PERCENT:-5}
      SERVICE_FEE_ADULT: ${SERVICE_FEE_ADULT:-1500}
      SERVICE_FEE_CHILD: ${SERVICE_FEE_CHILD:-1000}
      SERVICE_FEE_INFANT: ${SERVICE_FEE_INFANT:-0}
      PROVIDER_TIMEOUT: ${PROVIDER_TIMEOUT:-3s}
      PROVIDER_MAX_RETRIES: ${PROVIDER_MAX_RETRIES:-2}
      PROVIDER_RETRY_BACKOFF: ${PROVIDER_RETRY_BACKOFF:-200ms}
    ports:
      - "${HTTP_PORT:-8080}:${HTTP_PORT:-8080}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${HTTP_PORT}/health | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
